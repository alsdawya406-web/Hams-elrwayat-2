<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    if (sessionStorage.getItem("authenticated") !== "true") {
        window.location.href = "login.html";
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - همس الروايات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    :root { --bg-dark: #050A1F; --card-bg: #0B132B; --neon-blue: #00F5D4; --neon-purple: #7B2CBF; --text-light: #E0E1DD; --text-dim: #8D99AE; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); padding: 20px; }
    .container { max-width: 900px; margin: auto; }
    h1, h2, h3 { color: var(--neon-blue); margin-bottom: 15px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
    input, textarea, select { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid var(--neon-blue); background: rgba(0,0,0,0.3); color: #fff; outline: none; }
    
    .btn-neon { background: transparent; color: var(--neon-blue); border: 1px solid var(--neon-blue); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    @media (hover: hover) { .btn-neon:hover { background: var(--neon-blue); color: var(--bg-dark); box-shadow: 0 0 15px var(--neon-blue); } }
    .btn-neon:active { background: var(--neon-blue); color: var(--bg-dark); }
    .btn-danger { color: #ff4d4d; border-color: #ff4d4d; }
    @media (hover: hover) { .btn-danger:hover { background: #ff4d4d; color: #fff; box-shadow: 0 0 15px #ff4d4d; } }

    .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
    .item-card { background: rgba(0,0,0,0.2); border-radius: 8px; padding: 15px; border-right: 3px solid var(--neon-purple); display: flex; justify-content: space-between; align-items: center; }
    .stats-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .stat-card { background: rgba(0,245,212,0.05); padding: 15px; border-radius: 8px; border: 1px solid var(--neon-blue); text-align: center; }
    .stat-number { font-size: 1.8rem; font-weight: bold; color: var(--neon-blue); }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-user-shield"></i> لوحة التحكم - همس الروايات</h1>

    <!-- قسم الإحصائيات -->
    <div class="card">
      <h2><i class="fas fa-chart-line"></i> الإحصائيات العامة</h2>
      <div class="stats-box">
        <div class="stat-card"><div>إجمالي الكُتاب</div><div class="stat-number" id="stat-authors-count">0</div></div>
        <div class="stat-card"><div>إجمالي الروايات</div><div class="stat-number" id="stat-stories-count">0</div></div>
      </div>
      
      <h3 style="font-size: 1.1rem; color: var(--neon-purple);"><i class="fas fa-users"></i> متابعين الكُتاب</h3>
      <div id="stats-authors-details" style="margin-bottom: 15px;"></div>

      <h3 style="font-size: 1.1rem; color: var(--neon-purple);"><i class="fas fa-eye"></i> تفاصيل الروايات (المشاهدات والتعليقات)</h3>
      <div id="stats-stories-details"></div>
    </div>

    <!-- إضافة كاتب -->
    <div class="card">
      <h2><i class="fas fa-user-plus"></i> إضافة كاتب جديد</h2>
      <input type="text" id="author-name" placeholder="اسم الكاتب">
      <input type="number" id="author-age" placeholder="العمر">
      <textarea id="author-bio" placeholder="نبذة عن الكاتب"></textarea>
      <button class="btn-neon" onclick="addAuthor()"><i class="fas fa-plus"></i> حفظ الكاتب</button>
    </div>

    <!-- إضافة قصة -->
    <div class="card">
      <h2><i class="fas fa-book-medical"></i> إضافة قصة جديد</h2>
      <input type="text" id="story-title" placeholder="عنوان القصة">
      <select id="story-author-select"><option value="">اختر الكاتب</option></select>
      <select id="story-category">
        <option value="رعب">رعب</option>
        <option value="رومانسية">رومانسية</option>
        <option value="خيال علمي">خيال علمي</option>
        <option value="أكشن">أكشن</option>
      </select>
      <textarea id="story-body" rows="6" placeholder="محتوى القصة..."></textarea>
      <button class="btn-neon" onclick="addStory()"><i class="fas fa-plus"></i> نشر القصة</button>
    </div>

    <!-- إدارة الكُتاب -->
    <div class="card">
      <h2><i class="fas fa-users-cog"></i> إدارة الكُتاب</h2>
      <div class="grid-list" id="admin-authors-list"></div>
    </div>

    <!-- إدارة القصص -->
    <div class="card">
      <h2><i class="fas fa-tasks"></i> إدارة القصص</h2>
      <div class="grid-list" id="admin-stories-list"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = { databaseURL: "https://whisper-novels-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let authorsData = {}, storiesData = {}, commentsData = {};

    function loadAdminData() {
      db.ref('authors').on('value', snap => {
        authorsData = snap.val() || {};
        renderAdminAuthors();
        updateStats();
      });

      db.ref('stories').on('value', snap => {
        storiesData = snap.val() || {};
        renderAdminStories();
        updateStats();
      });

      db.ref('comments').on('value', snap => {
        commentsData = snap.val() || {};
        updateStats();
      });
    }

    function addAuthor() {
      const name = document.getElementById('author-name').value.trim();
      const age = document.getElementById('author-age').value.trim();
      const bio = document.getElementById('author-bio').value.trim();

      if (!name) return alert('برجاء كتابة اسم الكاتب');

      const newRef = db.ref('authors').push();
      newRef.set({ name, age, bio }).then(() => {
        alert('تمت إضافة الكاتب بنجاح');
        document.getElementById('author-name').value = '';
        document.getElementById('author-age').value = '';
        document.getElementById('author-bio').value = '';
      });
    }

    function addStory() {
      const title = document.getElementById('story-title').value.trim();
      const author = document.getElementById('story-author-select').value;
      const category = document.getElementById('story-category').value;
      const body = document.getElementById('story-body').value.trim();

      if (!title || !author || !body) return alert('برجاء استكمال بيانات القصة');

      const newRef = db.ref('stories').push();
      newRef.set({ title, author, category, body, views: 0 }).then(() => {
        alert('تم نشر القصة بنجاح');
        document.getElementById('story-title').value = '';
        document.getElementById('story-body').value = '';
      });
    }

    function deleteAuthor(key) {
      if (confirm('هل أنت تأكد من مسح هذا الكاتب؟')) {
        db.ref('authors/' + key).remove().then(() => alert('تم مسح الكاتب'));
      }
    }

    function deleteStory(key) {
      if (confirm('هل أنت تأكد من مسح هذه القصة؟')) {
        db.ref('stories/' + key).remove().then(() => alert('تم مسح القصة'));
      }
    }

    function renderAdminAuthors() {
      const list = document.getElementById('admin-authors-list');
      const select = document.getElementById('story-author-select');
      list.innerHTML = '';
      select.innerHTML = '<option value="">اختر الكاتب</option>';

      for (let key in authorsData) {
        const a = authorsData[key];
        select.innerHTML += `<option value="${a.name}">${a.name}</option>`;
        list.innerHTML += `
          <div class="item-card">
            <div><strong>${a.name}</strong></div>
            <button class="btn-neon btn-danger" onclick="deleteAuthor('${key}')"><i class="fas fa-trash"></i> مسح</button>
          </div>`;
      }
    }

    function renderAdminStories() {
      const list = document.getElementById('admin-stories-list');
      list.innerHTML = '';

      for (let key in storiesData) {
        const s = storiesData[key];
        list.innerHTML += `
          <div class="item-card">
            <div>
              <strong>${s.title}</strong><br>
              <small style="color:var(--text-dim);">${s.author}</small>
            </div>
            <button class="btn-neon btn-danger" onclick="deleteStory('${key}')"><i class="fas fa-trash"></i> مسح</button>
          </div>`;
      }
    }

    function updateStats() {
      const authorKeys = Object.keys(authorsData);
      const storyKeys = Object.keys(storiesData);

      document.getElementById('stat-authors-count').innerText = authorKeys.length;
      document.getElementById('stat-stories-count').innerText = storyKeys.length;

      // متابعين الكُتاب من LocalStorage (المحاكي)
      const follows = JSON.parse(localStorage.getItem('user_follows') || '[]');
      let authorStatsHTML = '';
      authorKeys.forEach(k => {
        const name = authorsData[k].name;
        const count = follows.filter(a => a === name).length;
        authorStatsHTML += `<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">${name}: <strong>${count} متابع</strong></div>`;
      });
      document.getElementById('stats-authors-details').innerHTML = authorStatsHTML || '<small style="color:var(--text-dim);">لا توجد بيانات</small>';

      // تفاصيل المشاهدات والتعليقات للقصص
      let storyStatsHTML = '';
      storyKeys.forEach(k => {
        const s = storiesData[k];
        const safeKey = encodeURIComponent(s.title).replace(/\./g, '%2E');
        const commentCount = commentsData[safeKey] ? Object.keys(commentsData[safeKey]).length : 0;
        storyStatsHTML += `<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.05);">${s.title}: <strong>${s.views || 0} مشاهدة</strong> | <strong>${commentCount} تعليق</strong></div>`;
      });
      document.getElementById('stats-stories-details').innerHTML = storyStatsHTML || '<small style="color:var(--text-dim);">لا توجد بيانات</small>';
    }

    window.onload = loadAdminData;
  </script>
</body>
</html>
